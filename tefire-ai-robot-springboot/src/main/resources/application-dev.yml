spring:
  datasource:
#    driver-class-name: org.postgresql.Driver # 数据库驱动类名
#    url: jdbc:postgresql://localhost:5432/robot # 数据库连接 URL
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver # 数据库驱动类名
    url: jdbc:p6spy:postgresql://localhost:5432/robot # 数据库连接 URL
    username: postgres # 数据库用户名
    password: postgres # 数据库密码
    hikari: # HikariCP 连接池配置
      pool-name: AI-Robot-HikariCP # 自定义连接池名称
      auto-commit: true # 是否自动提交事务
      connection-timeout: 30000 # 连接超时时间（毫秒）
      idle-timeout: 600000 # 空闲连接存活最大时间（毫秒）
      max-lifetime: 1800000 # 连接最大存活时间（毫秒）
      minimum-idle: 5 # 最小空闲连接数
      maximum-pool-size: 20 # 最大连接池大小
      connection-test-query: SELECT 1 # 连接测试查询
      validation-timeout: 5000 # 验证连接的有效性
  ai:
    openai:
      # 兼容 OpenAI 协议的模型服务地址，默认走阿里云百炼（可用环境变量 AI_BASE_URL 指向其他兼容服务）
      base-url: ${AI_BASE_URL:https://cn-beijing.maas.qianwenaiapi.com/compatible-mode/v1}
      # 模型服务 API Key，通过环境变量注入，不写进代码库
      api-key: ${AI_API_KEY:}
      embedding:
        model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding} # 向量化模型
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1536} # 维度，必须与向量表一致
    vectorstore:
      pgvector:
        index-type: HNSW # 索引类型
        distance-type: COSINE_DISTANCE # 距离类型
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1536} # 嵌入维度
        max-document-batch-size: 10000 # 每批处理的最大文档数
        table-name: t_vector_store # 向量表名称
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200} # ES 服务地址（端口被占用时用 ES_URIS 覆盖）
    connection-timeout: 5s # 建立连接超时
    socket-timeout: 30s # 读写超时（默认 30s）


okhttp: # OkHttp 客户端配置
  connect-timeout: 5000    # 建立连接的最大等待时间（毫秒）
  read-timeout: 30000      # 读取数据的最大等待时间（毫秒）
  write-timeout: 15000     # 写入数据的最大等待时间（毫秒）
  max-idle-connections: 200 # 连接池中保持的最大空闲连接数
  keep-alive-duration: 5   # 空闲连接在连接池中的存活时间（分钟）

searxng: # SearXNG 搜索引擎配置
  url: http://localhost:8888/search # SearXNG 服务的 API 端点地址
  count: 10 # 每次从搜索结果中，提取的最大数量
  engines: 360search # 指定聚合引擎（逗号分隔）；留空用默认引擎集，默认集在部分网络下不可达

customer-service:
  file-storage-path: data/files # 问答文件存储路径（相对启动目录）
  chunk-path: data/files/chunk # 分片文件存储路径
  model: ${AI_CHAT_MODEL:qwen3.8-flash} # 客服链路使用的模型名称
  temperature: 0.0 # 温度值

rag:
  splitter: # 文档切分
    enabled: true # 是否启用 Token 切分（关闭后，文档块保持按问答切分的原始形态）
    chunk-size: 800 # 每个文档块的目标大小（单位: Token）
    min-chunk-size-chars: 350 # 块内按标点截断时，允许的最小块字符数
  elasticsearch: # ES 双写双删配置（关键词召回开关）
    enabled: true # 是否启用
    index-name: rag_chunk # 文档块索引名称
  retrieval: # 检索策略
    hybrid-enabled: true # 是否开启混合检索
    vector-top-k: 10 # 向量检索路，召回的数量
    keyword-top-k: 10 # 关键词检索路，召回的数量
    rrf-k: 60 # RRF 融合常数，默认 60
  rerank: # 重排序策略
    enabled: true # 是否启用 Rerank 重排（关闭则保持 RRF 融合顺序，不做精排）
    model: ${AI_RERANK_MODEL:qwen3.7-text-rerank} # 重排序模型
    api-url: ${AI_RERANK_URL:https://cn-beijing.maas.qianwenaiapi.com/api/v1/services/rerank/text-rerank/text-rerank} # API 地址
    api-key: ${spring.ai.openai.api-key} # API Key
    top-n: 3 # 重排序后，最终喂给大模型的文档块数量
